name: Build & Release Android Native APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Android APKs via Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build Driver Android App
        working-directory: apps/driver-android
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p ../../build-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../build-artifacts/ir.serviceyar.driver-v1.2.0.apk

      - name: Build Parent Android App
        working-directory: apps/parent-android
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../build-artifacts/ir.serviceyar.parent-v1.2.0.apk

      - name: Generate SHA256SUMS
        working-directory: build-artifacts
        run: |
          sha256sum ir.serviceyar.driver-v1.2.0.apk ir.serviceyar.parent-v1.2.0.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serviceyar-android-apks
          path: build-artifacts/*

      - name: Publish to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.2.0' }}
          name: Release ${{ github.ref_name || 'v1.2.0' }}
          files: |
            build-artifacts/ir.serviceyar.driver-v1.2.0.apk
            build-artifacts/ir.serviceyar.parent-v1.2.0.apk
            build-artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
