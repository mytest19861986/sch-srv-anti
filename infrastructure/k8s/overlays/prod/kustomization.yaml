apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: school-transport-prod

namePrefix: prod-

resources:
  - ../../base

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend-api
    spec:
      replicas: 4
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2000m"
          memory: "1024Mi"
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: outbox-worker
    spec:
      replicas: 4
