networks:
  backend-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica_data:
  redis_data:
  localstack_data:
  uploads_data:

services:
  # 1. Reverse Proxy & Rate Limiter
  nginx:
    image: nginx:1.25-alpine
    container_name: school_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/rate-limit.conf:/etc/nginx/conf.d/rate-limit.conf:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - backend-net
    depends_on:
      backend-api:
        condition: service_healthy

  # 2. Backend API Service
  backend-api:
    build:
      context: ../../services/backend-api
      dockerfile: Dockerfile
    container_name: school_backend_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../packages:/app/packages:ro
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgres://school_user:school_secret_pass@postgres-primary:5432/school_transport
      - DATABASE_REPLICA_URL=postgres://school_user:school_secret_pass@postgres-replica:5432/school_transport
      - USE_READ_REPLICA=false
      - REDIS_URL=redis://redis:6379
      - CACHE_ADAPTER=inmemory
      - STORAGE_TYPE=local
      - NOTIFICATION_ADAPTER=mock
      - JWT_SECRET=demo_super_secret_jwt_key_2026
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. School Web Dashboard
  school-web:
    build:
      context: ../../
      dockerfile: apps/school-web/Dockerfile
    container_name: school_web_dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    networks:
      - backend-net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Super Admin Web Dashboard
  super-admin-web:
    build:
      context: ../../
      dockerfile: apps/super-admin-web/Dockerfile
    container_name: super_admin_web_dashboard
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    networks:
      - backend-net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 5. Outbox Worker Service
  outbox-worker:
    build:
      context: ../../services/backend-api
      dockerfile: Dockerfile.worker
    container_name: school_outbox_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://school_user:school_secret_pass@postgres-primary:5432/school_transport
      - REDIS_URL=redis://redis:6379
      - NOTIFICATION_ADAPTER=mock
    networks:
      - backend-net
      - data-net
    depends_on:
      postgres-primary:
        condition: service_healthy

  # 6. PostgreSQL Primary (Read/Write)
  postgres-primary:
    image: postgres:16-alpine
    container_name: school_pg_primary
    restart: unless-stopped
    environment:
      - POSTGRES_DB=school_transport
      - POSTGRES_USER=school_user
      - POSTGRES_PASSWORD=school_secret_pass
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./postgres/primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_transport"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. PostgreSQL Replica (Read-Only)
  postgres-replica:
    image: postgres:16-alpine
    container_name: school_pg_replica
    restart: unless-stopped
    environment:
      - PGUSER=school_user
      - PGPASSWORD=school_secret_pass
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
      - ./postgres/replica.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - data-net
    depends_on:
      postgres-primary:
        condition: service_healthy

  # 8. Redis (Cache, Rate Limit & Session Store)
  redis:
    image: redis:7.2-alpine
    container_name: school_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 9. LocalStack (S3 Object Storage Emulator)
  localstack:
    image: localstack/localstack:3.0
    container_name: school_localstack_s3
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - data-net
