# ==============================================================================
# Nginx Reverse Proxy Configuration for madresehyar.ir
# High-Performance, SSL-Terminated & Zero-Trust Hardened
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;

    # Upstream Clusters
    upstream backend_cluster {
        server backend-api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream school_web_cluster {
        server school-web:3001;
        keepalive 16;
    }

    upstream super_admin_cluster {
        server super-admin-web:3002;
        keepalive 16;
    }

    # -------------------------------------------------------------
    # HTTP to HTTPS Global Redirect
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name madresehyar.ir www.madresehyar.ir api.madresehyar.ir school.madresehyar.ir admin.madresehyar.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------
    # 1. API Backend (api.madresehyar.ir)
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.madresehyar.ir;

        ssl_certificate /etc/letsencrypt/live/madresehyar.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/madresehyar.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=api_rate_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_rate_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # -------------------------------------------------------------
    # 2. School Web Panel (school.madresehyar.ir & madresehyar.ir)
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name school.madresehyar.ir madresehyar.ir www.madresehyar.ir;

        ssl_certificate /etc/letsencrypt/live/madresehyar.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/madresehyar.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://school_web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # -------------------------------------------------------------
    # 3. Super Admin Panel (admin.madresehyar.ir)
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name admin.madresehyar.ir;

        ssl_certificate /etc/letsencrypt/live/madresehyar.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/madresehyar.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://super_admin_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
