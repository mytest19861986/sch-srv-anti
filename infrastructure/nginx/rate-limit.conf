# Rate Limiting Configuration: Smart Buckets for School Transport System

# 1. Burst-friendly zone for Attendance ingestion (Protects Morning Peak 06:45 - 07:30)
# 100 requests per second per IP with burst capacity of 50
limit_req_zone $binary_remote_addr zone=attendance_zone:10m rate=100r/s;

# 2. Offline batch sync reconnect zone
# 50 requests per second per IP with burst capacity of 30
limit_req_zone $binary_remote_addr zone=sync_zone:10m rate=50r/s;

# 3. Strict zone for Authentication & Security sensitive endpoints
# 5 requests per minute per IP with burst capacity of 3
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

# 4. Standard API rate limiting zone
limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=30r/s;
